<style>

.famgrid button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.rvsend{margin-left:auto;border:0;background:var(--orange);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800;min-height:40px}

.rvprog{flex:none}.rvprog .bar{margin:0 0 3px}.rvprog small{font-size:12px;color:var(--muted)}
.rvcard{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.rvhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.rvhead>div{flex:1;display:grid}
.rvko{font:800 26px/1.2 "Noto Sans KR",sans-serif;word-break:keep-all}.rvhead small{font-size:12px;color:var(--muted)}
.rvhead .say{margin:0}

.note{font-size:14px}

  <div class="story"><div class="smascot" id="bkMascot"></div><div><b data-t="storyTitle"></b><p data-t="story1"></p><p data-t="story2"></p></div></div>
  <h3 class="bh" data-t="pathH"></h3>
  <ol class="path" id="bkPath"></ol>
  <h3 class="bh" data-t="famH"></h3>
  <div class="famgrid" id="bkFam"></div>
  <p class="tiny" id="bkFamTxt"></p>
  <div class="cgrid" id="bkGrid"></div>
 </div></div>

 <div class="modal" id="mRvx" hidden><div class="box">
  <h2 data-t="rvxTitle"></h2>
  <p class="tiny" id="rvxStat" style="font-size:14px"></p>
  <p style="font-size:14px;margin:6px 0 10px" data-t="rvxHow"></p>
  <button class="primary" id="rvxShare" data-t="rvxShare"></button>
  <button class="secondary" id="rvxDown" style="margin-top:8px" data-t="rvxDown"></button>
  <button class="secondary" id="rvxCsv" style="margin-top:8px" data-t="rvxCsv"></button>
  <button class="secondary" id="rvxClose" style="margin-top:8px" data-t="ok"></button>
 </div></div>

 <div class="modal" id="mNotes" hidden><div class="box">
  <h2 data-t="notesH"></h2>
  <p class="fb-note" data-t="feedback"></p>
  <div class="links" id="linksN"></div>
  <div id="notesBody"></div>
  <button class="primary" id="bNotesOk" style="margin-top:12px" data-t="ok"></button>
 </div></div>

 <div class="modal" id="mSet" hidden><div class="box set">
  <h2 data-t="settings"></h2>
  <h3 data-t="lang"></h3><div class="lang" style="width:max-content"><button data-lang="az">Azərbaycanca</button><button data-lang="ko">한국어</button></div>
  <h3 data-t="roundSize"></h3><div class="chips" id="sizeChips"></div>
  <h3 data-t="timeLimit"></h3><div class="chips"><button class="chip" id="bTimer"></button></div>
  <h3 data-t="sound"></h3><div class="chips"><button class="chip" id="bAuto"></button><button class="chip" id="bTest" data-t="test"></button></div>
  <h3 data-t="voiceH"></h3><div class="field"><select id="voiceSel" aria-label="voice"></select></div>
  <h3 data-t="speedH"></h3><div class="chips" id="rateChips"></div>
  <h3 data-t="music"></h3><div class="chips"><button class="chip" id="bMusic"></button><input type="range" id="vol" min="0" max="100" aria-label="volume"></div>
  <h3 data-t="look"></h3><div class="chips"><button class="chip" id="bStache"></button></div>
  <h3 data-t="notesH"></h3><div class="chips"><button class="chip" id="bNotes" data-t="notesBtn"></button></div>
  <div id="rvSet" hidden><h3 data-t="rvH"></h3><div class="chips"><button class="chip" id="bReview2" data-t="rvOpen"></button></div></div>
  <h3 data-t="name"></h3><div class="field"><input id="nameSet" maxlength="14"></div>
  <div class="biz" id="bizBox"><b data-t="bizTitle"></b><br><span data-t="bizText"></span><div class="links" id="links"></div></div>
  <button class="secondary" id="bReset" style="margin-top:10px"></button>
  <button class="primary" id="bSetOk" style="margin-top:8px" data-t="ok"></button>
  <p class="foot"><span class="copy"></span><br><span data-t="credit"></span></p>
 </div></div>
</div>
